[package]
name = "rust-purs-gql"
version = "0.1.28"
edition = "2021"
default-run = "pursgql"
repository = "https://github.com/OxfordAbstracts/purescript-graphql-schema-gen"

[dependencies]
cynic = { version = "3.13.2", features = ["http-reqwest", "http-reqwest-blocking"] }
cynic-introspection = "3.13.2"
dotenv = "0.15.0"
futures = "0.3.30"
hashlink = "0.8.4"
phf = { version = "0.11.2", features = ["macros"] }
regex = "1"
reqwest = "0.13.4"
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio"] }
stringcase = "0.3.0"
tokio = { version = "1.40.0", features = ["full"] }
yaml-rust2 = "0.8.1"
serde_json = "1.0"
serde = "1.0"
serde_derive = "1.0"
serde_yaml = "0.9.34"

[[bin]]
edition = "2021"
name = "pursgql"
path = "src/main.rs"

[[bin]]
edition = "2021"
name = "check_migrations"
path = "src/main_check_needs_migrations.rs"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
